name: Materialize PR 8560 merge resolution

on:
  push:
    branches:
      - tmp/pr8560-merge-main-20260822
    paths:
      - .pr8560/merge-main.patch

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated merge patch
        shell: bash
        run: |
          set -euo pipefail
          expected='ff35516ef889032f09c089477fea3c52bee0d7284ee08b5af90db07acbc8fdbc'
          actual="$(sha256sum .pr8560/merge-main.patch | awk '{print $1}')"
          test "$actual" = "$expected"
          git apply --check .pr8560/merge-main.patch
          git apply .pr8560/merge-main.patch
          git rm .pr8560/merge-main.patch .github/workflows/pr8560-merge-main-materialize.yml
          git add -- .github/workflows/rust-benchmark.yml rust/lance-index/Cargo.toml rust/lance-index/benches/kmeans_recompute.rs rust/lance-index/src/vector/kmeans.rs
          git config user.name 'isaac-dasari'
          git config user.email '74317395+isaac-dasari@users.noreply.github.com'
          git commit -m 'materialize PR 8560 merge resolution'
          git push origin "HEAD:${GITHUB_REF_NAME}"
