name: KMeans Recompute Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/rust-benchmark.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  RUSTFLAGS: "-C debuginfo=1 -C target-cpu=native"
  RUST_BACKTRACE: "1"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout optimized implementation
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: 295c63d4db66f2b6f0dc269d881e4adf5460e758

      - name: Checkout baseline implementation
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline

      - uses: actions-rust-lang/setup-rust-toolchain@a0b538fa0b742a6aa35d6e2c169b4bd06d225a98 # v1
      - uses: rui314/setup-mold@725a8794d15fc7563f59595bd9556495c0564878 # v1
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y protobuf-compiler libssl-dev

      - name: Prepare benchmark harness on baseline
        run: |
          cp rust/lance-index/benches/kmeans_recompute.rs baseline/rust/lance-index/benches/kmeans_recompute.rs
          printf '\n[[bench]]\nname = "kmeans_recompute"\nharness = false\n' >> baseline/rust/lance-index/Cargo.toml

      - name: Run focused optimized tests
        run: |
          cargo test --profile bench -p lance-index --lib recompute

      - name: Measure baseline
        env:
          LANCE_CPU_THREADS: "62"
          RAYON_NUM_THREADS: "62"
        run: |
          set -o pipefail
          cargo bench --manifest-path baseline/Cargo.toml -p lance-index --bench kmeans_recompute -- --save-baseline before 2>&1 | tee baseline-benchmark.txt

      - name: Measure optimized implementation
        env:
          LANCE_CPU_THREADS: "62"
          RAYON_NUM_THREADS: "62"
        run: |
          set -o pipefail
          touch rust/lance-index/src/vector/kmeans.rs rust/lance-index/benches/kmeans_recompute.rs
          cargo bench -p lance-index --bench kmeans_recompute -- --baseline before 2>&1 | tee optimized-benchmark.txt

      - name: Upload Criterion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kmeans-recompute-validation-${{ github.run_id }}
          path: |
            baseline-benchmark.txt
            optimized-benchmark.txt
            target/criterion
          retention-days: 7
          if-no-files-found: warn
