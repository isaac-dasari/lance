name: PR8560 owner-chunk materialize

on:
  push:
    branches:
      - tmp/pr8560-ownerchunk-publish-20260822

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated patch
        run: |
          git apply --check .github/pr8560-ownerchunk.patch
          git apply .github/pr8560-ownerchunk.patch
          git diff --check
      - name: Commit materialized KMeans blob
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/lance-index/src/vector/kmeans.rs
          git commit -m 'materialize pr8560 owner-chunk blob'
          git push origin HEAD:${GITHUB_REF_NAME}
